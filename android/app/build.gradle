plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sreenlinux.display'
    compileSdk 33

    defaultConfig {
        applicationId "com.sreenlinux.display"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            // Signed with the debug key so `assembleRelease` produces an installable APK.
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // No external dependencies — the app only uses the Android framework.
}
